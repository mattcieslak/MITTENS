[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "mittens-dmri"
description = "Analytic voxel-to-voxel transition probabilities from (asymmetric) ODFs, and voxel-graph tractography"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Matt Cieslak", email = "mattcieslak@gmail.com" }]
dynamic = ["version"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.26", "scipy>=1.11", "nibabel>=5", "odx>=0.3.2", "igraph>=0.11"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/mattcieslak/MITTENS"

[tool.maturin]
manifest-path = "crates/mittens-py/Cargo.toml"
python-source = "."
module-name = "mittens._core"
features = ["pyo3/extension-module"]
include = [{ path = "mittens/_core.pyi", format = "sdist" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: Monte Carlo validation (deselect with -m 'not slow')"]
